
name: Android bridge

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Android
        uses: actions/checkout@v4
        with:
          path: framework/megalodonte-android

      - name: Checkout Core
        uses: actions/checkout@v4
        with:
          repository: eliezer-dev-software-enginner/megalodonte-core
          path: framework/libraries/megalodonte-core

      - name: Checkout Theme
        uses: actions/checkout@v4
        with:
          repository: eliezer-dev-software-enginner/megalodonte-theme
          path: framework/libraries/megalodonte-theme

      - name: Checkout Reactivity
        uses: actions/checkout@v4
        with:
          repository: eliezer-dev-software-enginner/megalodonte-reactivity
          path: framework/libraries/megalodonte-reactivity

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: framework/megalodonte-android/**/*.gradle*

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;36.0.0"

      - name: Build and Lint
        run: ./gradlew :app:assembleDebug :app:lintDebug
        working-directory: framework/megalodonte-android

